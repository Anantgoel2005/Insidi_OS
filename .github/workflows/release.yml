name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build reproducible source archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="Insidi_OS-${TAG}/" -o "dist/Insidi_OS-${TAG}.tar.gz" "${TAG}"
          git archive --format=zip --prefix="Insidi_OS-${TAG}/" -o "dist/Insidi_OS-${TAG}.zip" "${TAG}"
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "${TAG}"
          dist/Insidi_OS-${TAG}.tar.gz
          dist/Insidi_OS-${TAG}.zip
          dist/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "Insidi_OS ${TAG}"
